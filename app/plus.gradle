// Immich TV Studio: app identity, versioning and the extra source sets (src/plus).

def plusApplicationId = "nl.giejay.android.tv.immich.studio"
// set by .github/workflows/studio-release.yml, 0 for local builds
def plusBuildNumber = (System.getenv("PLUS_BUILD_NUMBER") ?: "0") as Integer
// owner/repo whose GitHub releases the in-app updater checks
def plusUpdateRepo = System.getenv("PLUS_UPDATE_REPO") ?: System.getenv("GITHUB_REPOSITORY") ?: "thimo513/Immich-TV-Studio"

def upstreamVersionCode = android.defaultConfig.versionCode
def upstreamVersionName = android.defaultConfig.versionName

android {
    defaultConfig {
        applicationId plusApplicationId
        // always higher than the previous plus build, also when upstream bumps its own versionCode
        versionCode upstreamVersionCode * 1000 + plusBuildNumber
        versionName "${upstreamVersionName}-studio.${plusBuildNumber}"
        buildConfigField "String", "PLUS_UPDATE_REPO", "\"${plusUpdateRepo}\""
    }

    sourceSets {
        main {
            java.srcDir 'src/plus/java'
            kotlin.srcDir 'src/plus/java'
            res.srcDir 'src/plus/res'
        }
        // build type manifests are merged over src/main/AndroidManifest.xml
        debug.manifest.srcFile 'src/plus/AndroidManifest.xml'
        release.manifest.srcFile 'src/plus/AndroidManifest.xml'
        // build type resources win over src/main: used to rename the app
        debug.res.srcDir 'src/plus/res-override'
        release.res.srcDir 'src/plus/res-override'
    }

    buildTypes {
        release {
            proguardFile 'plus-proguard-rules.pro'
        }
    }
}

// The google-services plugin needs a client entry for our applicationId. The fork has no Firebase
// project, so the placeholder from google-services.example is used with our package name.
def googleServices = file('google-services.json')
if (!googleServices.exists() || !googleServices.text.contains("\"${plusApplicationId}\"")) {
    googleServices.text = file('google-services.example').text
        .replace('"nl.giejay.android.tv.immich"', "\"${plusApplicationId}\"")
}

// Upstream injects its demo server and phone-login service from secrets. The fork uses the
// placeholders, so only the regular sign-in (server URL + API key) is available.
def stringsOther = file('src/main/res/values/strings_other.xml')
if (!stringsOther.exists()) {
    stringsOther.text = file('strings_other.xml.example').text
}
